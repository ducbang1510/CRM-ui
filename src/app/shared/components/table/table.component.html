<ng-container>
  <table
    [id]="tableId"
    mat-table
    [dataSource]="dataSource"
    class="mat-elevation-z8"
    [class.no-data-table]="totalRecords === 0"
  >
    <ng-container *ngFor="let column of headerColumns">
      <ng-container [matColumnDef]="column.key">
        <th mat-header-cell *matHeaderCellDef class="text-center">
          {{ column["text"] | translate }}
        </th>
        <td mat-cell *matCellDef="let element" class="text-center pointer">
          {{ getTableData(element, column) }}
        </td>
      </ng-container>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <!-- <app-no-data-found *ngIf="totalRecords === 0"></app-no-data-found> -->
</ng-container>
