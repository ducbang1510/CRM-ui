<!-- FAB Button -->
<button
  mat-fab
  class="chat-fab"
  (click)="toggleChat()"
  [class.chat-open]="isOpen"
>
  <mat-icon>{{ isOpen ? 'close' : 'auto_awesome' }}</mat-icon>
</button>

<!-- Chat Panel -->
<div class="chat-panel" *ngIf="isOpen">
  <!-- Header -->
  <div class="chat-header">
    <div class="d-flex align-items-center">
      <mat-icon class="me-2">auto_awesome</mat-icon>
      <span class="chat-title">{{ "aiChat.title" | translate }}</span>
    </div>
    <button mat-icon-button (click)="newSession()" [matTooltip]="'aiChat.newSession' | translate" class="new-session-btn">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>

  <!-- Messages -->
  <div class="chat-messages" #messageContainer>
    <div *ngIf="messages.length === 0" class="empty-state text-center py-4">
      <mat-icon class="empty-icon">chat_bubble_outline</mat-icon>
      <p class="text-muted mt-2">{{ "aiChat.placeholder" | translate }}</p>
    </div>

    <div
      *ngFor="let msg of messages"
      class="message"
      [class.user-message]="msg.role === 'user'"
      [class.assistant-message]="msg.role === 'assistant'"
    >
      <div class="message-bubble">
        <div class="message-content" *ngIf="msg.role === 'user'">{{ msg.content }}</div>
        <div class="message-content markdown-body" *ngIf="msg.role === 'assistant'" [innerHTML]="renderMarkdown(msg.content)"></div>
        <div class="message-tools" *ngIf="msg.toolsUsed && msg.toolsUsed.length > 0">
          <mat-chip-set>
            <mat-chip *ngFor="let tool of msg.toolsUsed" class="tool-chip">
              {{ tool }}
            </mat-chip>
          </mat-chip-set>
        </div>
        <div class="message-time">
          {{ msg.timestamp | date:'shortTime' }}
        </div>
      </div>
    </div>

    <div *ngIf="isLoading" class="message assistant-message">
      <div class="message-bubble loading-bubble">
        <mat-spinner diameter="20"></mat-spinner>
        <span class="ms-2">{{ "aiChat.thinking" | translate }}</span>
        <button
          mat-icon-button
          class="cancel-btn"
          (click)="cancelRequest()"
          [matTooltip]="'aiChat.cancel' | translate"
        >
          <mat-icon>stop_circle</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="chat-input">
    <mat-form-field appearance="outline" class="flex-grow-1">
      <input
        matInput
        [(ngModel)]="userInput"
        (keydown)="onKeyDown($event)"
        [placeholder]="'aiChat.inputPlaceholder' | translate"
        autocomplete="off"
      />
    </mat-form-field>
    <button
      mat-icon-button
      color="primary"
      (click)="sendMessage()"
      [disabled]="!userInput.trim()"
      class="send-btn"
    >
      <mat-icon>send</mat-icon>
    </button>
  </div>
</div>
